name: HealthIntake
options:
  bundleIdPrefix: com.philippegodfroy
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: "NO"
targets:
  HealthIntake:
    type: application
    platform: iOS
    sources: [App]
    info:
      path: App/Info.plist
      properties:
        UILaunchScreen: {}
        NSCameraUsageDescription: >-
          The camera is used to capture a scan that becomes input for your
          personal advice. Images never leave your device in this demo.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
  HealthIntakeTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: HealthIntake
schemes:
  HealthIntake:
    build:
      targets:
        HealthIntake: all
    test:
      targets: [HealthIntakeTests]
